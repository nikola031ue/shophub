services:
  api:
    build:
      context: ./backend
      dockerfile: ShopHub.Api/Dockerfile
    ports:
      - "5002:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=shophubdb;Username=shophub;Password=shophub123
      - ASPNETCORE_ENVIRONMENT=Development
      - Jwt__SecretKey=${JWT_SECRET_KEY:-dev-secret-key-change-in-production-min-32-chars}
      - Jwt__Issuer=ShopHubApi
      - Jwt__Audience=ShopHubClient
      - Jwt__AccessTokenExpirationMinutes=60
      - Jwt__RefreshTokenExpirationDays=7
      - Cors__Origins__0=http://localhost:3001
      - OpenTelemetry__Endpoint=http://host.docker.internal:4317
      - OpenTelemetry__ServiceName=shophub
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    depends_on:
      - api

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: shophubdb
      POSTGRES_USER: shophub
      POSTGRES_PASSWORD: shophub123
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shophub -d shophubdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
