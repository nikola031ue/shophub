services:
  api:
    build:
      context: ./backend
      dockerfile: ShopHub.Api/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=shophubdb;Username=shophub;Password=shophub123
      - ASPNETCORE_ENVIRONMENT=Development
      - Jwt__Key=${JWT_KEY:-dev-secret-key-change-in-production-min-32-chars}
      - Jwt__Issuer=shophub
      - Jwt__Audience=shophub
      - Jwt__ExpiryMinutes=60
      - Cors__Origins__0=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: shophubdb
      POSTGRES_USER: shophub
      POSTGRES_PASSWORD: shophub123
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shophub -d shophubdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
